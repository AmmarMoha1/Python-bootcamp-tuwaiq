<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{ category }}</title>
</head>

<body>

    <h1>Category: {{ category }}</h1>

    {% for post in posts %}

    <h2>
        <a href="{% url 'blog:detail' post.id %}">
            {{ post.title }}
        </a>
    </h2>

    {% empty %}

    <p>No posts found.</p>

    {% endfor %}

    <a href="{% url 'blog:list' %}">
        Back to Blog
    </a>

</body>

</html>
