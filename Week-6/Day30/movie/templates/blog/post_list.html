<!DOCTYPE html>
<html lang="en">

<head>
    <title>Blog</title>
</head>

<body>

    <h1>Blog Posts</h1>

    {% for post in posts %}

    <h2>
        <a href="{% url 'blog:detail' post.id %}">
            {{ post.title }}
        </a>
    </h2>

    <a href="{% url 'blog:category' post.category %}">
        {{ post.category }}
    </a>

    {% endfor %}

    <br><br>

    <a href="{% url 'pages:home' %}">
        Home
    </a>

</body>

</html>
