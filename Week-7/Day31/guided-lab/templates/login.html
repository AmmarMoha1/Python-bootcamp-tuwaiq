<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Username:</label>

        <input type="text" name="username" required>

        <button type="submit">
            Login
        </button>
    </form>

</body>

</html>
