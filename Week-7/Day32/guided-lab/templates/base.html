{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Django Platform
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav>
        <h2>Django Platform</h2>

        <div>
            <a href="{% url 'pages:home' %}">

            <a href="{% url 'pages:about' %}">

            </a>

    <main>

    <footer>
        <p>© 2026 Django Platform</p>
    </footer>

</body>

</html>
